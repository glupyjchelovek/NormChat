name: 🤖 Deploy NormBot to Supabase

on:
  push:
    branches:
      - main
      - claude/optimistic-ramanujan-wqrSE
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    name: Deploy Edge Function + Set Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ai-bot edge function
        run: |
          supabase functions deploy ai-bot \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set ANTHROPIC_API_KEY secret in Supabase
        run: |
          supabase secrets set \
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Done
        run: echo "✅ NormBot deployed successfully!"
