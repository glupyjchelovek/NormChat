<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NormChat 💬</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>

  <!-- ═══════════════ WELCOME SCREEN ═══════════════ -->
  <div id="welcome-screen" class="welcome-screen">
    <div class="welcome-card">
      <div class="welcome-logo">
        <span class="logo-emoji">💬</span>
        <h1 class="logo-title">NormChat</h1>
        <p class="logo-sub">Real-time chat, zero drama ✨</p>
      </div>

      <div class="form-section">
        <label class="field-label">Your name</label>
        <input
          id="name-input"
          class="name-input"
          type="text"
          placeholder="Enter your name…"
          maxlength="20"
          autocomplete="off"
        />
      </div>

      <div class="form-section">
        <label class="field-label">Pick your avatar</label>
        <div class="avatar-grid" id="avatar-grid">
          <!-- avatars injected by JS -->
        </div>
      </div>

      <button id="join-btn" class="join-btn" disabled>
        <span>Join Chat</span>
        <span class="btn-arrow">→</span>
      </button>

      <p id="welcome-error" class="welcome-error hidden">Please enter a name and pick an avatar!</p>
    </div>
  </div>

  <!-- ═══════════════ CHAT SCREEN ═══════════════ -->
  <div id="chat-screen" class="chat-screen hidden">

    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="header-logo">💬</div>
        <div>
          <h1 class="header-title">NormChat</h1>
          <p class="header-status" id="online-status">Connecting…</p>
        </div>
      </div>
      <div class="header-right">
        <div class="my-avatar-badge" id="my-avatar-badge">
          <span id="my-avatar-display"></span>
        </div>
        <span class="my-name-display" id="my-name-display"></span>
        <button class="logout-btn" id="logout-btn" title="Change profile">✏️</button>
      </div>
    </header>

    <!-- Messages area -->
    <div class="messages-area" id="messages-area">
      <div class="messages-inner" id="messages-inner">
        <div class="chat-day-divider">
          <span>Today</span>
        </div>
        <!-- messages injected here -->
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator hidden" id="typing-indicator">
      <span id="typing-text"></span>
      <span class="typing-dots"><span></span><span></span><span></span></span>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <div class="input-wrap">
        <button class="emoji-btn" id="emoji-btn" title="Emoji">😊</button>
        <textarea
          id="msg-input"
          class="msg-input"
          placeholder="Type a message…"
          rows="1"
          maxlength="1000"
        ></textarea>
        <button class="send-btn" id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

      <!-- Simple emoji picker -->
      <div class="emoji-picker hidden" id="emoji-picker">
        <!-- emojis injected by JS -->
      </div>
    </div>

  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
</body>
</html>
